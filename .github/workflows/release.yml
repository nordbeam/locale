name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry-run:
        description: Pack and run `npm publish --dry-run` without publishing
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write # npm trusted publishing (OIDC); provenance is added once the repository is public

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
      - run: npm ci
      - name: Check that the release tag matches every package version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          node -e "
            const tag = process.env.TAG.replace(/^v/, '');
            const tools = require('./package.json');
            const runtime = require('./packages/locale/package.json');
            const migrate = require('./packages/locale-migrate/package.json');
            const problems = [];
            if (runtime.version !== tag) problems.push('@nordbeam/locale is ' + runtime.version);
            if (tools.version !== tag) problems.push('nordbeam-locale is ' + tools.version);
            if (migrate.version !== tag) problems.push('@nordbeam/locale-migrate is ' + migrate.version);
            if (runtime.peerDependencies['nordbeam-locale'] !== tag) problems.push('@nordbeam/locale peers on nordbeam-locale ' + runtime.peerDependencies['nordbeam-locale']);
            if (tools.peerDependencies['@nordbeam/locale'] !== tag) problems.push('nordbeam-locale peers on @nordbeam/locale ' + tools.peerDependencies['@nordbeam/locale']);
            if (migrate.peerDependencies['nordbeam-locale'] !== tag) problems.push('@nordbeam/locale-migrate peers on nordbeam-locale ' + migrate.peerDependencies['nordbeam-locale']);
            if (problems.length) { console.error('Tag ' + process.env.TAG + ' does not match: ' + problems.join('; ')); process.exit(1); }
          "
      - run: npm test
      - name: Publish to npm
        env:
          DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry-run) && '--dry-run' || '' }}
          # Trusted publishing authenticates through OIDC; the token is only a fallback.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # The runtime, the tooling and the migration package name each other as exact
          # peers, so they go out together in this order. A version that is already on
          # npm (a rerun, or a manual first publish) is skipped instead of failing.
          for dir in ./packages/locale . ./packages/locale-migrate; do
            spec=$(node -p "const p = require('$dir/package.json'); p.name + '@' + p.version")
            if npm view "$spec" version >/dev/null 2>&1; then
              echo "$spec is already on npm"
            else
              npm publish "$dir" --access public $DRY_RUN
            fi
          done
